<svg xmlns="http://www.w3.org/2000/svg" width="470" height="148" viewBox="0 0 470 148" role="img" aria-labelledby="title desc"><title id="title">GoodByeFirewall, museum label</title><desc id="desc">Museum label number 1, The bridge: GoodByeFirewall. Fork of GoodByeDPI: gets past deep packet inspection and network restrictions. Written in JavaScript.</desc><style>@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}@keyframes sh{0%,100%{opacity:.95;transform:translateX(0)}50%{opacity:.55;transform:translateX(1.6px)}}.tw{animation:tw 3.4s ease-in-out infinite}.sh{animation:sh 2.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.tw,.sh{animation:none}}</style><rect x="6" y="7" width="460" height="136" fill="#000000" fill-opacity=".16"/><rect x="4" y="4" width="460" height="136" fill="#0d1c47" stroke="#c79a3e"/><text x="26" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#8fd0c4" letter-spacing="1.6">N° 1 · THE BRIDGE</text><text x="26" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" font-style="italic" text-anchor="start" fill="#f6d66b">GoodByeFirewall</text><text x="26" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" font-style="normal" text-anchor="start" fill="#d3dbe8">Fork of GoodByeDPI: gets past deep packet inspection and</text><text x="26" y="101" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" font-style="normal" text-anchor="start" fill="#d3dbe8">network restrictions.</text><ellipse cx="74" cy="123" rx="48" ry="10" fill="#e0a12c" transform="rotate(-2 74 123)"/><text x="74" y="127.2" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" fill="#10224f">JavaScript</text><text x="448" y="127.2" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="400" font-style="italic" text-anchor="end" fill="#d3dbe8">open the repository →</text></svg>
